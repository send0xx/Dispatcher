name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8 and .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Dispatcher.slnx

      - name: Build
        run: dotnet build Dispatcher.slnx -c Release --no-restore

  test:
    name: Test ${{ matrix.framework }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            coverage: false
          - framework: net10.0
            coverage: true
    env:
      COVERAGE_ARGUMENTS: ${{ matrix.coverage && format('--coverage --coverage-output-format cobertura --coverage-settings {0}/coverage.runsettings', github.workspace) || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8 and .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test reflection implementation
        run: >-
          dotnet test tests/Dispatcher.DependencyInjection.Tests/Dispatcher.DependencyInjection.Tests.csproj
          -c Release
          --framework ${{ matrix.framework }}
          $COVERAGE_ARGUMENTS
          ${{ matrix.coverage && '--coverage-output Dispatcher.DependencyInjection.Tests.cobertura.xml' || '' }}

      - name: Test source generation
        run: >-
          dotnet test tests/Dispatcher.SourceGeneration.Tests/Dispatcher.SourceGeneration.Tests.csproj
          -c Release
          --framework ${{ matrix.framework }}
          $COVERAGE_ARGUMENTS
          ${{ matrix.coverage && '--coverage-output Dispatcher.SourceGeneration.Tests.cobertura.xml' || '' }}

      - name: Test implementation parity
        run: >-
          dotnet test tests/Dispatcher.Parity.Tests/Dispatcher.Parity.Tests.csproj
          -c Release
          --framework ${{ matrix.framework }}
          $COVERAGE_ARGUMENTS
          ${{ matrix.coverage && '--coverage-output Dispatcher.Parity.Tests.cobertura.xml' || '' }}

      - name: Upload coverage to Coveralls
        if: matrix.coverage
        uses: coverallsapp/github-action@v2
        with:
          files: >-
            TestResults/Dispatcher.DependencyInjection.Tests.cobertura.xml
            TestResults/Dispatcher.SourceGeneration.Tests.cobertura.xml
            TestResults/Dispatcher.Parity.Tests.cobertura.xml
          format: cobertura

  publish_aot:
    name: Publish Native AOT sample
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish samples/NativeAot/Dispatcher.NativeAotHostSample -c Release

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - publish_aot
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack Send0xx.Dispatcher.Abstractions
        run: dotnet pack src/Dispatcher.Abstractions/Dispatcher.Abstractions.csproj -c Release -o artifacts/packages

      - name: Pack Send0xx.Dispatcher
        run: dotnet pack src/Dispatcher/Dispatcher.csproj -c Release -o artifacts/packages

      - name: Pack Send0xx.Dispatcher.DependencyInjection
        run: >-
          dotnet pack src/Dispatcher.DependencyInjection/Dispatcher.DependencyInjection.csproj
          -c Release
          -o artifacts/packages

      - name: Pack Send0xx.Dispatcher.SourceGeneration
        run: >-
          dotnet pack src/Dispatcher.SourceGeneration/Dispatcher.SourceGeneration.csproj
          -c Release
          -o artifacts/packages

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(dotnet msbuild src/Dispatcher.Abstractions/Dispatcher.Abstractions.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '\r')"

          assert_entry() {
            local PACKAGE_PATH="artifacts/packages/${1}.${PACKAGE_VERSION}.nupkg"

            if ! unzip -l "$PACKAGE_PATH" | grep -qF "$2"; then
              echo "Package '$1' is missing '$2'."
              exit 1
            fi
          }

          assert_entry Send0xx.Dispatcher.SourceGeneration analyzers/dotnet/cs/Dispatcher.SourceGeneration.Analyzers.dll

          for TARGET_FRAMEWORK in net8.0 net10.0
          do
            assert_entry Send0xx.Dispatcher.Abstractions "lib/${TARGET_FRAMEWORK}/Dispatcher.Abstractions.dll"
            assert_entry Send0xx.Dispatcher "lib/${TARGET_FRAMEWORK}/Dispatcher.dll"
            assert_entry Send0xx.Dispatcher.DependencyInjection "lib/${TARGET_FRAMEWORK}/Dispatcher.DependencyInjection.dll"
            assert_entry Send0xx.Dispatcher.SourceGeneration "lib/${TARGET_FRAMEWORK}/Dispatcher.SourceGeneration.dll"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 7

  publish_nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_SOURCE_URL: https://api.nuget.org/v3/index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Log in to NuGet with trusted publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Validate version and publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(dotnet msbuild src/Dispatcher.Abstractions/Dispatcher.Abstractions.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '\r')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a supported version tag."
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version '$TAG_VERSION' does not match package version '$PACKAGE_VERSION'."
            exit 1
          fi

          for PACKAGE_ID in \
            Send0xx.Dispatcher.Abstractions \
            Send0xx.Dispatcher \
            Send0xx.Dispatcher.DependencyInjection \
            Send0xx.Dispatcher.SourceGeneration
          do
            PACKAGE_PATH="artifacts/packages/${PACKAGE_ID}.${PACKAGE_VERSION}.nupkg"
            if [[ ! -f "$PACKAGE_PATH" ]]; then
              echo "Missing package: $PACKAGE_PATH"
              exit 1
            fi

            dotnet nuget push "$PACKAGE_PATH" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE_URL" \
              --skip-duplicate
          done
