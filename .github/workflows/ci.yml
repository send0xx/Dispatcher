name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8 and .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Dispatcher.slnx

      - name: Build
        run: dotnet build Dispatcher.slnx -c Release --no-restore

  test:
    name: Test ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net8.0
          - net10.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8 and .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test reflection implementation
        run: >-
          dotnet test tests/Dispatcher.DependencyInjection.Tests/Dispatcher.DependencyInjection.Tests.csproj
          -c Release
          --framework ${{ matrix.framework }}

      - name: Test source generation
        run: >-
          dotnet test tests/Dispatcher.SourceGeneration.Tests/Dispatcher.SourceGeneration.Tests.csproj
          -c Release
          --framework ${{ matrix.framework }}

      - name: Test implementation parity
        run: >-
          dotnet test tests/Dispatcher.Parity.Tests/Dispatcher.Parity.Tests.csproj
          -c Release
          --framework ${{ matrix.framework }}

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack Send0xx.Dispatcher.Abstractions
        run: dotnet pack src/Dispatcher.Abstractions/Dispatcher.Abstractions.csproj -c Release -o artifacts/packages

      - name: Pack Send0xx.Dispatcher
        run: dotnet pack src/Dispatcher/Dispatcher.csproj -c Release -o artifacts/packages

      - name: Pack Send0xx.Dispatcher.DependencyInjection
        run: >-
          dotnet pack src/Dispatcher.DependencyInjection/Dispatcher.DependencyInjection.csproj
          -c Release
          -o artifacts/packages

      - name: Pack Send0xx.Dispatcher.SourceGeneration
        run: >-
          dotnet pack src/Dispatcher.SourceGeneration/Dispatcher.SourceGeneration.csproj
          -c Release
          -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 7

  publish_nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_SOURCE_URL: https://api.nuget.org/v3/index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Log in to NuGet with trusted publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Validate version and publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(dotnet msbuild src/Dispatcher.Abstractions/Dispatcher.Abstractions.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '\r')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a supported version tag."
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version '$TAG_VERSION' does not match package version '$PACKAGE_VERSION'."
            exit 1
          fi

          for PACKAGE_ID in \
            Send0xx.Dispatcher.Abstractions \
            Send0xx.Dispatcher \
            Send0xx.Dispatcher.DependencyInjection \
            Send0xx.Dispatcher.SourceGeneration
          do
            PACKAGE_PATH="artifacts/packages/${PACKAGE_ID}.${PACKAGE_VERSION}.nupkg"
            if [[ ! -f "$PACKAGE_PATH" ]]; then
              echo "Missing package: $PACKAGE_PATH"
              exit 1
            fi

            dotnet nuget push "$PACKAGE_PATH" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE_URL" \
              --skip-duplicate
          done
